[package]
name = "bugreport-insight-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
grep-regex = { workspace = true }
grep-matcher = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
regex-automata = "0.4"
libc = "0.2"
# `sha2 0.10.9` is pure Rust and needs no C toolchain; it replaces `ring` per
# open item 17 and is the crate named for ARCH-ARCHIVE in the architecture docs.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
bugreport-insight-test-fixtures = { workspace = true }
